<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QSHIELD-FL</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="landing">
    <section class="landingHero">
      <div class="landingKicker">Quantum Federated IDS</div>
      <h1>QSHIELD-FL Dashboard</h1>
      <div class="landingActions">
        <a class="btn" href="/admin">Open Dashboard</a>
      </div>
    </section>

    <section class="landingGrid">
      <article class="card">
        <div class="cardTitle">Runs</div>
        <div class="cardSub">Browse saved result folders and artifacts.</div>
      </article>
      <article class="card">
        <div class="cardTitle">Charts</div>
        <div class="cardSub">Scenario curves, compare views, rank snapshots.</div>
      </article>
      <article class="card">
        <div class="cardTitle">Inference</div>
        <div class="cardSub">Load checkpoints, test samples, batch results.</div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <span>QSHIELD-FL</span>
  </footer>
</body>
</html>
